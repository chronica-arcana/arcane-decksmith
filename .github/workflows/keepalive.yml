name: Keep-alive

# Hält das Supabase-Projekt (Gratis-Tarif pausiert nach ca. 7 Tagen Inaktivität) aktiv
# und prüft nebenbei, ob die Vercel-Seite erreichbar ist. Schlägt ein Aufruf fehl,
# schickt GitHub eine E-Mail über den fehlgeschlagenen Lauf.
#
# Benötigt (Repo → Settings → Secrets and variables → Actions):
#   Secrets:    SUPABASE_URL, SUPABASE_ANON_KEY   (dieselben Werte wie VITE_SUPABASE_* in Vercel)
#   Variables:  SITE_URL                          (z. B. https://arcane-decksmith.vercel.app)
# und die einmal ausgeführte Migration supabase/migrations/20261016000000_ping.sql.

on:
  schedule:
    - cron: "17 5 * * *" # täglich 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL und SUPABASE_ANON_KEY fehlen."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "Antwort: ${response}"
          echo "${response}" | grep -q '"ok"' || { echo "::error::Unerwartete Antwort von Supabase."; exit 1; }

      - name: Vercel-Seite prüfen
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::warning::Variable SITE_URL fehlt, Vercel-Prüfung übersprungen."
            exit 0
          fi
          status="$(curl --fail --silent --show-error --location \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "${SITE_URL}")"
          echo "Vercel antwortete mit HTTP ${status}"
