# Spiel-Worker. Deployment: .github/workflows/deploy-game-worker.yml
name = "arcane-decksmith-game"
main = "src/index.js"
compatibility_date = "2025-09-01"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "LOBBY", class_name = "Lobby" },
  { name = "HISTORY", class_name = "History" }
]

# SQLite-gestützte Durable Objects (im Gratis-Tarif die einzige Variante).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["History"]

# Werte werden beim Deployment gesetzt (GitHub-Variablen/-Secrets), nicht hier.
[vars]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
ALLOWED_ORIGINS = ""

[observability]
enabled = false
